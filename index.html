<html>
    <head>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body id="indexBody">
        <h1 id="indexH1">Welcome to FitCRM</h1>
        <p id="indesP">Your all-in-one solution for customer relationship management in the fitness industry.</p>
        <img src="./assets/website.png" id="image" alt="Fitness Image">
        <input type="text" id="FullName" name="FullName" placeholder="Enter your full name">
        <input type="number" id="Age" name="Age" placeholder="Enter your age">
        <select id="Gender" name="Gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Potato">Potato</option>
        </select>
        <input type="email" id="Email" name="Email" placeholder="Enter your email">
        <input type="tel" id="PhoneNumber" name="PhoneNumber" placeholder="Enter your phone number">
        <select id="Goal" name="Goal">
            <option id="weightLoss" value="Weight Loss">Weight Loss</option>
            <option id="muscleGain" value="Muscle Gain">Muscle Gain</option>
            <option id="generalFitness" value="General Fitness">General Fitness</option>
        </select>
        <input type="date" id="StartDate" name="StartDate" placeholder="Select your start date">
        <button id="submit" type="submit">Add Client</button>
    </body>
</html>
